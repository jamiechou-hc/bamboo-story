<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>竹藪中・真相之影</title><style>
*{box-sizing:border-box}body{margin:0;background:#18231f;color:#eee8d8;font-family:serif}header,nav,section{max-width:1100px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}button,select,textarea{font:inherit;color:inherit;background:#304039;border:1px solid #87947d;border-radius:5px;padding:10px}button{cursor:pointer}button:focus-visible{outline:3px solid #e5c581}h1{margin:0;letter-spacing:.15em}#stage{position:relative;overflow:hidden;min-height:440px;height: min(65vh,650px);background:#293b32}#art{position:absolute;width:100%;height:100%;object-fit:cover;animation:zoom 22s ease-out both}#mist{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 60%,#e7e9d144,transparent 65%);animation:drift 12s infinite alternate}#words{position:absolute;bottom:0;width:100%;padding:28px;background:linear-gradient(transparent,#101915ee 35%);line-height:1.8}#words h2{margin:0;font-size:clamp(24px,4vw,40px)}#words p{font-size:clamp(17px,2.4vw,24px);max-width:850px;margin:10px 0}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}progress{width:100%;accent-color:#d1b77b}details{border-top:1px solid #647365;padding:14px 0;line-height:1.8}textarea{width:100%;min-height:90px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #657366;text-align:left}small{color:#c1c9b8}@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.09)}}@keyframes drift{to{transform:translateX(15%)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.still *{animation:none!important}</style><header><h1>竹藪中・真相之影</h1><small>芥川龍之介｜教學改編 V2</small></header><main><div id="stage"><img id="art" alt="水墨風格象徵場景"><div id="mist"></div><div id="words" aria-live="polite"><small id="tag"></small><h2 id="heading"></h2><p id="story"></p></div></div><nav><button id="prev">上一景</button><button id="next">下一景</button><button id="play">▶ 自動觀影</button><button id="sound">開啟音景</button><button id="motion">減少動態</button><select id="chap" aria-label="章節選擇"></select><progress id="progress" max="18"></progress><small id="count"></small></nav><section><h2>閱讀卷宗</h2><details><summary>思考與辨析</summary><p id="question"></p></details><details><summary>證詞比較</summary><table><tr><th>敘事者</th><th>陳述重點</th><th>閱讀焦點</th></tr><tr><td>多襄丸</td><td>承認責任，塑造公平較量的形象</td><td>自我辯護</td></tr><tr><td>真砂</td><td>承認責任，描述丈夫的凝視</td><td>羞恥與社會規訓</td></tr><tr><td>武弘</td><td>提出不同說法，提及未知人物</td><td>妒忌與敘事限制</td></tr></table></details><details><summary>個人閱讀筆記</summary><textarea id="note" placeholder="記下你的觀察（僅存在此瀏覽器）"></textarea></details><p><small>依課文重新轉述；畫面、色彩及導讀為改編詮釋。敏感情節以留白處理。非完整課文替代品。</small></p></section></main><script src="scenes.js"></script><script>
const $=id=>document.getElementById(id);let i=0,timer=null,ac=null;try{i=Math.min(17,Math.max(0,Number(localStorage.getItem('bamboo2-progress'))||0));$('note').value=localStorage.getItem('bamboo2-note')||''}catch(e){};scenes.forEach((s,j)=>{let o=new Option(`${j+1}｜${s[0]}・${s[1]}`,j);$('chap').add(o)});function show(){let s=scenes[i];$('art').src=`assets/${i}.svg`;$('art').style.animation='none';void $('art').offsetWidth;$('art').style.animation='';$('tag').textContent=s[0]+'｜'+s[2];$('heading').textContent=s[1];$('story').textContent=s[3];$('question').textContent=s[4];$('chap').value=i;$('progress').value=i+1;$('count').textContent=`${i+1} / ${scenes.length}`;$('prev').disabled=i===0;$('next').disabled=i===17;try{localStorage.setItem('bamboo2-progress',i)}catch(e){}}function stop(){clearInterval(timer);timer=null;$('play').textContent='▶ 自動觀影'}function move(d){i=Math.max(0,Math.min(17,i+d));show()}$('prev').onclick=()=>{stop();move(-1)};$('next').onclick=()=>{stop();move(1)};$('chap').onchange=()=>{stop();i=Number($('chap').value);show()};$('play').onclick=()=>{if(timer){stop();return}if(i===17){i=0;show()}$('play').textContent='Ⅱ 暫停';timer=setInterval(()=>{if(i===17)stop();else move(1)},16000)};$('motion').onclick=()=>{document.body.classList.toggle('still');$('motion').textContent=document.body.classList.contains('still')?'恢復動態':'減少動態'};$('note').oninput=()=>{try{localStorage.setItem('bamboo2-note',$('note').value)}catch(e){}};$('sound').onclick=async()=>{if(ac){await ac.close();ac=null;$('sound').textContent='開啟音景';return}try{ac=new AudioContext();await ac.resume();let b=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate),a=b.getChannelData(0);for(let j=0;j<a.length;j++)a[j]=Math.random()*2-1;let n=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();n.buffer=b;n.loop=true;f.type='lowpass';f.frequency.value=420;g.gain.value=.08;n.connect(f).connect(g).connect(ac.destination);n.start();$('sound').textContent='關閉音景'}catch(e){ac=null;$('sound').textContent='音景不可用'}};show();</script></html>
